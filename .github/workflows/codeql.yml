name: "CodeQL (advanced setup)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 12 * * 1'

# Cancel a pull request's previous run when it gets a new push, so that a run
# nobody waits for anymore doesn't hold runners: the organization's jobs share
# a limit of 20 concurrent jobs. Pushes and scheduled runs aren't cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: 'ubuntu-latest'
    container: 'nvcr.io/nvidia/cuda:13.2.1-devel-ubuntu24.04'
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: none
    steps:
    - name: Install Git
      run: apt-get update && apt-get install -y git

    - name: Configure Git safe directory
      run: git config --global --add safe.directory /__w/mfaktc/mfaktc

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.2
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4.38.2
      with:
        category: "/language:${{matrix.language}}"
